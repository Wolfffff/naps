# Install once with `pre-commit install`; run everything with `pre-commit run --all-files`.
# The `ty` hook needs an environment with the project installed (`uv pip install -e ".[dev]"`)
# and `ty` on PATH, so activate that environment before committing.
exclude: ^(docs/notebooks/|docs/_static/|docs/_build/|tests/data/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # the conda recipe is a Jinja template, not plain YAML
        exclude: ^\.conda/.*meta\.yaml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false
